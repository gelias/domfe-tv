name: Pacote Windows da Domfe TV

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: python -m unittest discover -s tests -p "test_*.py"
      - name: Gerar executável portátil
        run: npm run desktop:windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Calcular checksum do executável
        shell: pwsh
        run: |
          Get-ChildItem dist/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content "$($_.FullName).sha256" -Encoding ascii
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Domfe-TV-Windows-x64
          path: |
            dist/*.exe
            dist/*.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: Domfe-TV-Windows-x64
          path: dist
      - name: Publicar executável no GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "Domfe TV $RELEASE_TAG" --notes-file docs/RELEASE-NOTES.md
          fi
          gh release upload "$RELEASE_TAG" dist/*.exe dist/*.sha256 --clobber
