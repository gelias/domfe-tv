appId: br.org.domfe.tv
productName: Domfe TV
asar: true
directories:
  output: dist
files:
  - desktop/**
  - src/**
  - config/**
  - content/**
  - assets/images/**
  - index.html
  - styles.css
  - package.json
win:
  icon: assets/images/logo-domfe.png
  target:
    - target: portable
      arch: [x64]
  artifactName: Domfe-TV-${version}-windows-${arch}.${ext}
portable:
  requestExecutionLevel: user
mac:
  artifactName: Domfe-TV-${version}-mac-${arch}.${ext}
  target:
    - target: zip
      arch: [arm64]
  category: public.app-category.education
linux:
  target: AppImage
  category: Education
